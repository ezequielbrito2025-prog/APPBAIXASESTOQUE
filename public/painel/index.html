<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E5A45">
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<title>Painel de Conferência — Estoque</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#E4DFD2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;color:#17211D}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
a{color:inherit}
#app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:2px 2px 18px}
.topbar b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.topbar span{font-size:13px;color:#5E6A64}
.topbar .sp{flex-grow:1}
.linkbtn{height:38px;padding:0 14px;border:1.5px solid #B8B2A2;border-radius:10px;background:transparent;font-size:13px;font-weight:600}
.card{background:#FBFAF6;border:1px solid #DDD8CB;border-radius:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{height:40px;padding:0 18px;border-radius:20px;font-size:14px;font-weight:600;border:1.5px solid #B8B2A2;background:transparent}
.tab.a{background:#17211D;color:#fff;border-color:#17211D}
.panel{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#5E6A64;text-transform:uppercase}
.inp{height:44px;padding:0 14px;border:1.5px solid #B8B2A2;border-radius:12px;background:#FBFAF6;color:#17211D;font-size:15px;outline:none}
.inp:focus{border-color:#0E5A45}
.btn{height:44px;padding:0 20px;border:0;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.p{background:#0E5A45;color:#fff}
.btn.p:disabled{background:#D5D1C5;color:#6B746F;cursor:not-allowed}
.btn.o{background:transparent;color:#0E5A45;border:1.5px solid #0E5A45}
.btn.d{background:transparent;color:#A8281F;border:1.5px solid #E7B9B4}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px}
.note{font-size:12.5px;color:#5E6A64;line-height:1.5}
.note.warn{color:#7A4A00;background:#FBEBCB;padding:10px 12px;border-radius:10px}
.note.err{color:#A8281F;background:#F8DEDB;padding:10px 12px;border-radius:10px}
.note.ok{color:#0E5A45;background:#DCEBE4;padding:10px 12px;border-radius:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:10px 14px;background:#F2EFE7;border-radius:12px;display:flex;flex-direction:column;min-width:110px}
.stat span{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#5E6A64;text-transform:uppercase}
.stat b{font-size:18px;font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid #DDD8CB;border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
th{background:#0E5A45;color:#fff;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #E8E4D8;white-space:nowrap}
tbody tr:nth-child(even){background:#F7F5EE}
td.num,th.num{text-align:right}
.mono{font-family:ui-monospace,"SF Mono",Consolas,Menlo,monospace}
.muted{color:#8A938E}
.empty{padding:28px;text-align:center;color:#8A938E;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:9;padding:12px 16px;border-radius:12px;background:#17211D;color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#A8281F}
.login{max-width:380px;margin:14vh auto;display:flex;flex-direction:column;gap:14px}
.login b{font-size:20px}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:#3E4A44}
.searchbox{position:relative;flex-grow:1;min-width:200px}
.pdfrow{cursor:pointer}
.pdfrow:hover{background:#EFEAD9}
</style>
</head>
<body>
<div id="app"></div>
<script src="/painel/vendor/xlsx.full.min.js"></script>
<script src="/painel/vendor/jspdf.umd.min.js"></script>
<script src="/painel/painel.js"></script>
<noscript>Este painel precisa de JavaScript habilitado no navegador.</noscript>
</body>
</html>
